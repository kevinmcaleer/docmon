# Reusable multi-arch image build that stamps OCI provenance labels
# (org.opencontainers.image.source / .revision / .created / .version),
# so docmon can report which repo and commit every image came from.
#
# Call it from any repo:
#
#   jobs:
#     image:
#       uses: kevinmcaleer/docmon/.github/workflows/build-image.yml@main
#       permissions:
#         contents: read
#         packages: write
#       with:
#         image: ghcr.io/${{ github.repository }}
name: Build image

on:
  workflow_call:
    inputs:
      image:
        description: Full image name without a tag, e.g. ghcr.io/owner/name
        required: true
        type: string
      context:
        description: Build context
        default: .
        type: string
      dockerfile:
        description: Path to the Dockerfile
        default: Dockerfile
        type: string
      platforms:
        description: Comma-separated target platforms
        default: linux/arm64,linux/arm/v7
        type: string
      push:
        description: Push to the registry (false only builds)
        default: true
        type: boolean
    outputs:
      digest:
        description: Digest of the pushed image index
        value: ${{ jobs.build.outputs.digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Permissions come from the caller: contents: read, plus packages: write to push.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sets org.opencontainers.image.{source,revision,created,version,...}
      # from the repo and commit that triggered the run.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ inputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
