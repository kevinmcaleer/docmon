# Listener for Docker Desktop on a Mac (or Windows):
#   docker compose -f listener-mac.yaml up -d
# Then open http://localhost:8080
#
# On Docker Desktop, `network_mode: host` means the host of Docker's Linux VM,
# not your Mac, so listener.yaml's web page isn't reachable on localhost.
# This file publishes the ports instead. On the Pis, keep using listener.yaml.
services:
  docmon-listener:
    image: ghcr.io/kevinmcaleer/docmon-listener:latest
    container_name: docmon-listener
    restart: unless-stopped
    ports:
      - "8080:8080"         # web page and JSON API
      - "50505:50505/udp"   # agent broadcasts
    volumes:
      - docmon-data:/data
    environment:
      DOCMON_PORT: "50505"
      DOCMON_HTTP_PORT: "8080"
      # DOCMON_LOG_LEVEL: DEBUG   # logs every beat received

volumes:
  docmon-data:
