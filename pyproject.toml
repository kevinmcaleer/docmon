[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmon"
version = "0.1.0"
description = "Discover which Docker containers run on which node of a LAN cluster"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
agent = ["docker>=7.1"]
listener = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=2.3,<3", "httpx>=0.27"]
dev = [
    "mcp>=2.3,<3",
    "docker>=7.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
docmon-agent = "docmon_agent.__main__:main"
docmon-listener = "docmon_listener.__main__:main"
docmon-mcp = "docmon_mcp.__main__:main"

[project.urls]
Source = "https://github.com/kevinmcaleer/docmon"

[tool.setuptools.packages.find]
where = ["schema", "agent", "listener", "mcp"]

[tool.setuptools.package-data]
docmon_listener = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["schema", "agent", "listener", "mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
